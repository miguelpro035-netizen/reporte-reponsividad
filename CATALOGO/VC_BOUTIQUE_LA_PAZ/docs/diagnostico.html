<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Diagnóstico de código PWA / DOM · V&C</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>body{font-family:'DM Sans',Arial,sans-serif;background:#171216;color:#f6eef2;padding:15px}.box{background:#261d23;padding:15px;border-radius:8px;margin-bottom:15px}textarea{width:100%;min-height:140px;background:#171216;color:#fde047;border:1px solid #3b2f36;padding:10px;font-family:monospace}.btn{min-height:44px;background:#c94f83;color:#fff;border:0;padding:0 16px;border-radius:5px;font-weight:700;cursor:pointer}#panelResultado{display:none}.bad{background:#ef4444;color:#fff;padding:2px 6px;border-radius:3px;font-size:11px}.ok{background:#22c55e;color:#fff;padding:2px 6px;border-radius:3px;font-size:11px}</style></head><body>
<div class="box"><h2>Diagnóstico de código PWA &amp; bloqueos DOM</h2><p>Pega tu HTML/CSS para detectar clases bloqueadas por Brave/Opera y <code>100vh</code> rígido (herramienta de la guía de Event Bubbling y Código Limpio).</p><textarea id="codigoInput" placeholder="Pega aquí tu HTML/CSS..."></textarea><button class="btn" id="btnAnalizar">Analizar y optimizar</button></div>
<div id="panelResultado" class="box"><h3>Informe de diagnóstico</h3><div id="detallesReporte"></div><h4>Código sugerido</h4><textarea id="codigoSugerido" readonly></textarea></div>
<script>$(function(){$('#btnAnalizar').off('click').on('click',function(){const src=$('#codigoInput').val();if(!src.trim())return alert('Por favor pega algún código.');const hallazgos=[];let limpio=src;
[/ad-banner/gi,/promo-box/gi,/social-ads/gi,/analytics/gi,/tracker/gi].forEach(rx=>{if(rx.test(src)){hallazgos.push(['BLOQUEO GRAVE','bad',`Clase sospechosa ${rx} (Brave/Opera la ocultarán).`]);limpio=limpio.replace(rx,'seccion-destacada');}});
if(/100vh/gi.test(src)&&!/min-height/gi.test(src)){hallazgos.push(['DESBORDAMIENTO','bad','100vh rígido: usar min-height: 100dvh.']);limpio=limpio.replace(/height:\s*100vh;/gi,'min-height: 100dvh;');}
const $r=$('#detallesReporte').empty();$r.append($('<p>').append($('<b>').text('Dictamen: '),$('<span>').addClass(hallazgos.length<=2?'ok':'bad').text(hallazgos.length<=2?'CÓDIGO RESCATABLE':'REFACTORIZAR')));
const $ul=$('<ul>');hallazgos.forEach(h=>$ul.append($('<li>').append($('<span>').addClass(h[1]).text(h[0]),document.createTextNode(' '+h[2]))));if(!hallazgos.length)$ul.append($('<li>').append($('<span>').addClass('ok').text('EXCELENTE'),document.createTextNode(' Sin clases bloqueables ni errores de viewport.')));$r.append($ul);
$('#codigoSugerido').val(limpio);$('#panelResultado').slideDown();});});</script></body></html>
